# Local dev (IDE) — Postgres only; run the app from your IDE / mvnw + Vite:
#   docker compose up -d db
#   cd api && ./mvnw spring-boot:run        # API on :8080
#   cd web && npm install && npm run dev     # UI on :3000 (HMR), proxies /api
#
# Prod-like single container — UI baked into the jar, everything on :8080:
#   docker compose --profile full up --build

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
    ports:
      # Bind to loopback only — the app reaches the db over the compose network
      # as "db:5432", so the published port is just for host-side tooling (IDE,
      # psql). "5432:5432" would publish it to the whole LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images store data under a version subdir; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["full"]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-finance}
      DB_USER: ${POSTGRES_USER:-finance}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Hard floor on imported transactions (ISO date, UTC). Blank = no floor.
      IMPORT_MIN_POSTED_DATE: ${IMPORT_MIN_POSTED_DATE:-}
      # Google sign-in (for public exposure via Cloudflare). Set SPRING_PROFILES_ACTIVE=oauth
      # plus the client id/secret and the email allowlist to require login; unset = auth off.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FINANCE_AUTH_ALLOWED_EMAILS: ${FINANCE_AUTH_ALLOWED_EMAILS:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
