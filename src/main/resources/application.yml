spring:
  application:
    name: finance
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DB_USER:finance}
    password: ${DB_PASSWORD:finance}
  jpa:
    hibernate:
      # Liquibase owns the schema. Hibernate validates entities against it and
      # never alters tables — a mismatch fails fast at startup, by design.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        cache:
          # In-memory L2 cache (JCache/EhCache) for read-heavy reference entities
          # only — see the @Cache-annotated entities and CacheConfiguration, which
          # creates one region per entity. Transactions and other growing/
          # write-heavy tables are deliberately NOT cached.
          use_second_level_cache: true
          region:
            factory_class: jcache
        javax:
          cache:
            # The CacheManager is supplied by CacheConfiguration (all regions are
            # created up front), so a missing region is a misconfiguration.
            missing_cache_strategy: fail
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    rest:
      # Never auto-expose repositories; only repos explicitly annotated for
      # export are served. Ours are all @RepositoryRestResource(exported=false).
      detection-strategy: annotated
      # Keep Spring Data REST off "/" so it can't shadow the SPA's index.html.
      base-path: /internal-data-rest
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cache:
    type: jcache

finance:
  discord:
    # Discord channel webhook URL; notifications are skipped when blank.
    webhook-url: ${DISCORD_WEBHOOK_URL:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
