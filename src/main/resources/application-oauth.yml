# Google sign-in, activated only with the "oauth" profile (SPRING_PROFILES_ACTIVE=oauth).
# Without this profile the Google client isn't registered and auth stays disabled,
# so local dev runs without credentials. Enable in prod (behind Cloudflare) with:
#   SPRING_PROFILES_ACTIVE=oauth
#   GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=...
#   FINANCE_AUTH_ALLOWED_EMAILS=you@gmail.com,partner@gmail.com
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
